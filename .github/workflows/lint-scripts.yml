name: Lint Scripts

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: Lint Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          severity: warning
          format: gcc

  python-lint:
    name: Lint Python Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pylint
          # pytest and requests are also needed by pylint to resolve the
          # test imports.
          pip install pytest==9.1.1 requests==2.34.2
          pip install -r workspaces/test/dtaas/login-relay/requirements.txt

      - name: Run startup and CI-script unit tests
        run: |
          python -m pytest workspaces/test/startup -q
          python -m pytest workspaces/test/dtaas/ci/scripts -q

      - name: Run flake8
        run: |
          # Check if any Python files exist (excluding Poetry projects and venv)
          if find . \
            -name "*.py" \
            -not -path "./venv/*" \
            -not -path "./.venv/*" \
            -not -path "./workspaces/src/admin/*" \
            | grep -q .;
          then
            flake8 . \
              --count \
              --select=E9,F63,F7,F82 \
              --show-source \
              --statistics \
              --exclude=./venv/*,./.venv/*,./workspaces/src/admin/*
            flake8 . \
              --count \
              --max-complexity=10 \
              --max-line-length=127 \
              --statistics \
              --exclude=./venv/*,./.venv/*,./workspaces/src/admin/*
          else
            echo "No Python files found to lint"
          fi

      - name: Run pylint
        run: |
          # Check if any Python files exist (excluding Poetry projects and venv)
          if find . \
            -name "*.py" \
            -not -path "./venv/*" \
            -not -path "./.venv/*" \
            -not -path "./workspaces/src/admin/*" \
            | grep -q .;
          then
            find . \
              -name "*.py" \
              -not -path "./venv/*" \
              -not -path "./.venv/*" \
              -not -path "./workspaces/src/admin/*" \
              | xargs pylint
          else
            echo "No Python files found to lint"
          fi

  yaml-lint:
    name: Lint YAML Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.12'

      - name: Install yamllint
        run: |
          python -m pip install --upgrade pip
          pip install yamllint

      - name: Run yamllint
        run: |
          yamllint .

  markdown-lint:
    name: Lint Markdown Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      # Rules come from .markdownlint.yaml, skipped files from
      # .markdownlint-cli2.yaml.
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"
