name: Test Fully Installed Workspace Image

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'workspaces/src/**'
    paths-ignore:
      - 'workspaces/src/admin/**'
      - 'workspaces/src/install/admin/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-workspace-image:
    name: Build and Cache Workspace Image
    strategy:
      fail-fast: false
      matrix:
        arch:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.arch.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build workspace image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./workspaces
          file: workspaces/Dockerfile.ubuntu.noble.xfce
          push: false
          platforms: ${{ matrix.arch.platform }}

      - name: Start services
        shell: bash
        run: |
          docker compose -f workspaces/test/dtaas/compose.yml up -d
          sleep 30

      - name: Check service health
        uses: ./.github/actions/check-service-health
        with:
          compose_file: workspaces/test/dtaas/compose.yml

      - name: Test service endpoint
        uses: ./.github/actions/check-connectivity
        with:
          url: "http://localhost/user/services"
          expected_response_code: "200"

      - name: Show service logs on failure
        if: failure()
        shell: bash
        run: |
          echo "TEST FAILED - PRINTING DIAGNOSTICS:"
          echo ""
          echo "========================================"
          echo "|           Services Status            |"
          echo "========================================"
          docker compose -f workspaces/test/dtaas/compose.yml ps
          echo ""
          echo "========================================"
          echo "|            Workspace Logs            |"
          echo "========================================"
          docker compose -f workspaces/test/dtaas/compose.yml \
            logs workspace

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          docker compose -f workspaces/test/dtaas/compose.yml down -v
          docker system prune -f