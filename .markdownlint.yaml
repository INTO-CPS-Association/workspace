default: true
MD033: false
MD013:
  code_blocks: false
  tables: false
MD046:
  style: "fenced"
# The same heading under different parents (e.g. "Shell Scripts" under both
# linting and style sections) is fine; only siblings must differ.
MD024:
  siblings_only: true
overrides:
