# ⚠️ DEVELOPMENT ONLY - INSECURE CONFIGURATION ⚠️
# This configuration uses Traefik for multi-user scenario.
# This configuration uses Traefik in HTTP mode for development/testing.
# For production deployments with TLS/HTTPS, use compose.traefik.secure.tls.yml instead.

name: dtaas

services:
  traefik:
    image: traefik:v3.6.4
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--entryPoints.web.address=:80"
      - "--entrypoints.web.forwardedHeaders.insecure=true"
      - "--entrypoints.web.proxyProtocol.insecure=true"
      - "--log.level=DEBUG"
    ports:
      - "80:80"
    volumes:
      # Root-equivalent access to the host's Docker daemon, even read-only.
      # See "Docker socket" in TRAEFIK.md before using this outside development.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - users

  user1:
    image: workspace:latest
    #image: intocps/workspace:latest
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: Dockerfile.ubuntu.noble.xfce
    environment:
      - MAIN_USER=${USERNAME1:-user1}
    volumes:
      - ./files/${USERNAME1:-user1}:/workspace
      - ./files/common:/workspace/common
    shm_size: 512m
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.u1.entryPoints=web"
      - "traefik.http.routers.u1.rule=PathPrefix(`/${USERNAME1:-user1}`)"
    networks:
      - users

  user2:
    image: mltooling/ml-workspace-minimal:0.13.2
    restart: unless-stopped
    environment:
      - AUTHENTICATE_VIA_JUPYTER=
      - WORKSPACE_BASE_URL=${USERNAME2:-user2}
    volumes:
      - ./files/user2:/workspace
      - ./files/common:/workspace/common
    shm_size: 512m
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.u2.entryPoints=web"
      - "traefik.http.routers.u2.rule=PathPrefix(`/${USERNAME2:-user2}`)"
    networks:
      - users

networks:
  users:
    name: dtaas-users
